[package]
name = "assay"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wildmason/assay"
homepage = "https://github.com/wildmason/assay"
description = "Dependency upgrade impact analyzer — test upgrades against your projects' real CI before you adopt them"
readme = "README.md"
keywords = ["dependency", "upgrade", "ci", "cargo", "npm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "assay"
path = "src/main.rs"

[lib]
name = "assay"
path = "src/lib.rs"

[dependencies]
cargo_metadata = "0.18"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
regex = "1.11"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"
